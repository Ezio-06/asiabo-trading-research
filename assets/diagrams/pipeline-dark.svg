<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656c76"/></marker></defs>
<rect width="960" height="330" rx="12" fill="#0d1117"/>
<text x="24" y="34.0" font-size="17" fill="#f0f6fc" font-weight="700" text-anchor="start">How every idea was tested</text>
<rect x="21" y="64" width="140" height="104" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
<circle cx="39" cy="84" r="10" fill="#656c76"/>
<text x="39" y="88.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="55" y="89.0" font-size="13.5" fill="#f0f6fc" font-weight="700" text-anchor="start">Idea</text>
<text x="33" y="116.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">A theory that names</text>
<text x="33" y="130.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">who pays: who loses</text>
<text x="33" y="145.7" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">money to you, and why?</text>
<line x1="163" y1="116.0" x2="177" y2="116.0" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="179" y="64" width="140" height="104" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/>
<circle cx="197" cy="84" r="10" fill="#656c76"/>
<text x="197" y="88.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="213" y="89.0" font-size="13.5" fill="#f0f6fc" font-weight="700" text-anchor="start">Prediction</text>
<text x="191" y="116.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Expected result written</text>
<text x="191" y="130.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">down BEFORE the run,</text>
<text x="191" y="145.7" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">scored afterwards.</text>
<line x1="321" y1="116.0" x2="335" y2="116.0" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="337" y="64" width="140" height="104" rx="10" fill="#13233a" stroke="#4493f8" stroke-width="1.2"/>
<circle cx="355" cy="84" r="10" fill="#4493f8"/>
<text x="355" y="88.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="371" y="89.0" font-size="13.5" fill="#f0f6fc" font-weight="700" text-anchor="start">Noise bar</text>
<text x="349" y="116.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Same test on fake</text>
<text x="349" y="130.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">random markets. Pass</text>
<text x="349" y="145.7" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">bar sits above noise.</text>
<line x1="479" y1="116.0" x2="493" y2="116.0" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="407.0" y1="170" x2="407.0" y2="226" stroke="#656c76" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<rect x="495" y="64" width="140" height="104" rx="10" fill="#13233a" stroke="#4493f8" stroke-width="1.2"/>
<circle cx="513" cy="84" r="10" fill="#4493f8"/>
<text x="513" y="88.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="529" y="89.0" font-size="13.5" fill="#f0f6fc" font-weight="700" text-anchor="start">Real data</text>
<text x="507" y="116.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Training years only.</text>
<text x="507" y="130.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Every trade vs its</text>
<text x="507" y="145.7" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">coin-flip twin.</text>
<line x1="637" y1="116.0" x2="651" y2="116.0" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="565.0" y1="170" x2="565.0" y2="226" stroke="#656c76" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<rect x="653" y="64" width="140" height="104" rx="10" fill="#13233a" stroke="#4493f8" stroke-width="1.2"/>
<circle cx="671" cy="84" r="10" fill="#4493f8"/>
<text x="671" y="88.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="687" y="89.0" font-size="13.5" fill="#f0f6fc" font-weight="700" text-anchor="start">Shuffle tests</text>
<text x="665" y="116.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Shuffled copies of real</text>
<text x="665" y="130.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">history: which part</text>
<text x="665" y="145.7" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">needs the real order?</text>
<line x1="795" y1="116.0" x2="809" y2="116.0" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="723.0" y1="170" x2="723.0" y2="226" stroke="#656c76" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<rect x="811" y="64" width="140" height="104" rx="10" fill="#13233a" stroke="#4493f8" stroke-width="1.2"/>
<circle cx="829" cy="84" r="10" fill="#4493f8"/>
<text x="829" y="88.0" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="845" y="89.0" font-size="13.5" fill="#f0f6fc" font-weight="700" text-anchor="start">Sealed exam</text>
<text x="823" y="116.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Fresh data, spent</text>
<text x="823" y="130.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">once. The script locks</text>
<text x="823" y="145.7" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">itself afterwards.</text>
<rect x="337" y="230" width="456" height="72" rx="10" fill="#2a1517" stroke="#f85149" stroke-width="1.2"/>
<text x="353" y="256.0" font-size="13" fill="#f85149" font-weight="700" text-anchor="start">✕  Fail any test → killed, with a cause of death on record</text>
<text x="353" y="280.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Most ideas end here, several of mine included. Full list in RETIREMENT.md.</text>
<line x1="881.0" y1="170" x2="881.0" y2="226" stroke="#656c76" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="811" y="230" width="140" height="72" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.2"/>
<text x="823" y="256.0" font-size="13" fill="#3fb950" font-weight="700" text-anchor="start">✓  Survivor</text>
<text x="823" y="280.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">2 real but small,</text>
<text x="823" y="294.9" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">0 deployable</text>
<text x="21" y="252.0" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Steps 1–2 keep</text>
<text x="21" y="267.4" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">you honest.</text>
<text x="21" y="282.8" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">Steps 3–6 try to</text>
<text x="21" y="298.2" font-size="11" fill="#9198a1" font-weight="400" text-anchor="start">kill the idea.</text>
</svg>
